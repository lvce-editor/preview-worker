name: Integration
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 236de223cab8f9eeb72dc68a260b63f0db3b4ef9
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Build application static export
        working-directory: .tmp/lvce-integration
        run: |-
          npm run build:static:ignore-icon-theme
          npm run build:server
          npm run test-static-export
        env:
          PATH_PREFIX: /lvce-editor
      - name: Test HTML preview browser integration
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: node src/_all.js --ci --headless --test-name-prefix=viewlet.layout-html-preview
        shell: bash
